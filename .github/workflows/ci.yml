name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck=
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version-file: .golangci-lint-version

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l ./cmd ./internal)"
      - name: Check JavaScript syntax
        run: |
          for file in internal/admin/assets/*.js; do
            node --check "$file"
          done
      - name: Vet
        run: go vet ./...
      - name: Test
        run: CGO_ENABLED=0 go test ./... -count=1
      - name: Race detector
        run: CGO_ENABLED=1 go test -race ./... -count=1
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: windows, goarch: amd64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
          - {goos: android, goarch: arm64}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross compile
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o vertex-proxy ./cmd/vproxy
      - name: Version smoke test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: ./vertex-proxy --version

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        # Docker Hub 在 GitHub Actions runner 上经常抖动（i/o timeout / rate limit），
        # 失败时重试最多 3 次，每次间隔 30 秒。
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          timeout_minutes: 15
          retry_wait_seconds: 30
          command: docker build --tag vertex-ai-proxy:ci .
          on_retry_command: docker system prune -f || true
